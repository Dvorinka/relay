services:
  relay:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        # Stamps both the binary and the embedded SPA version footer.
        RELAY_VERSION: ${RELAY_VERSION:-dev}
    env_file: .env
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay?sslmode=disable
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: relay-ak
      STORAGE_SECRET_KEY: relay-sk-secret
      STORAGE_BUCKET: relay
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-http://localhost:8080}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # S3-compatible object storage for dev/self-host. MinIO removed its public
  # images in 2025; RustFS is the drop-in dev default. Any S3 endpoint works
  # via STORAGE_* env vars (AWS S3, R2, Garage, ...).
  storage:
    image: rustfs/rustfs:latest
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: relay-ak
      RUSTFS_SECRET_KEY: relay-sk-secret
    volumes:
      - s3data:/data
    ports:
      - "9000:9000"
    restart: unless-stopped

  # Creates the bucket once so first run works without manual steps.
  storage-init:
    image: amazon/aws-cli:latest
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: relay-ak
      AWS_SECRET_ACCESS_KEY: relay-sk-secret
      AWS_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "sleep 3;
      aws --endpoint-url http://storage:9000 s3 mb s3://relay || true"
    restart: "no"

volumes:
  pgdata:
  s3data:
