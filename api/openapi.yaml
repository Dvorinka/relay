openapi: 3.1.0
info:
  title: Relay API
  version: 0.1.0
  description: >
    Relay - open-source agent communication & project hub.
    This document is the single source of truth for the HTTP contract;
    the TypeScript client in packages/api-client is generated from it.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8080
    description: local dev
tags:
  - name: auth
  - name: workspaces
paths:
  /api/health:
    get:
      operationId: health
      summary: Liveness/readiness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string }

  /api/auth/register:
    post:
      operationId: register
      summary: Register a new account
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Registered; session cookie set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/login:
    post:
      operationId: login
      summary: Log in with email and password
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in; session cookie set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/logout:
    post:
      operationId: logout
      summary: Log out and revoke the session
      tags: [auth]
      responses:
        "204": { description: Logged out; session cookie cleared }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/session:
    get:
      operationId: session
      tags: [auth]
      summary: Current session - user plus workspaces
      responses:
        "200":
          description: Active session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [auth]
      security: []
      summary: Request a password reset token (always 204; never leaks whether the email exists)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "204":
          description: "If the email exists, a reset link was sent"
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a new password from a reset token
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 10 }
      responses:
        "204": { description: Password changed; all sessions revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/password/change:
    post:
      operationId: changePassword
      summary: Change the current password
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10 }
      responses:
        "204": { description: Password changed; other sessions revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces for the current user
      tags: [workspaces]
      responses:
        "200":
          description: Workspaces the current user belongs to
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: "#/components/schemas/WorkspaceWithRole" }
    post:
      operationId: createWorkspace
      summary: Create a workspace
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                slug: { type: string, pattern: "^[a-z0-9-]{2,40}$" }
      responses:
        "201":
          description: Created; caller becomes owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      summary: Get a workspace by id
      tags: [workspaces]
      parameters: [ { $ref: "#/components/parameters/WorkspaceId" } ]
      responses:
        "200":
          description: Workspace detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/members:
    get:
      operationId: listWorkspaceMembers
      summary: List workspace members
      tags: [workspaces]
      parameters: [ { $ref: "#/components/parameters/WorkspaceId" } ]
      responses:
        "200":
          description: Member list
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/WorkspaceMember" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}/invite:
    post:
      operationId: inviteToWorkspace
      summary: Add an existing user to the workspace
      tags: [workspaces]
      description: v1 adds an existing user directly; email invites come later.
      parameters: [ { $ref: "#/components/parameters/WorkspaceId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/WorkspaceRole" }
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMember" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: relay_session
    mcpBearer:
      type: http
      scheme: bearer
      description: Agent MCP token (rly_...), evaluated on the /mcp endpoint only.
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicts with existing state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        avatar_url: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10 }
        name: { type: string, minLength: 1, maxLength: 80 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AuthSession:
      type: object
      required: [user, workspaces]
      properties:
        user: { $ref: "#/components/schemas/User" }
        workspaces:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceWithRole" }

    Workspace:
      type: object
      required: [id, name, slug, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        created_at: { type: string, format: date-time }

    WorkspaceWithRole:
      allOf:
        - $ref: "#/components/schemas/Workspace"
        - type: object
          required: [role]
          properties:
            role: { $ref: "#/components/schemas/WorkspaceRole" }

    WorkspaceRole:
      type: string
      enum: [owner, admin, member]

    WorkspaceMember:
      type: object
      required: [user, role]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
security:
  - sessionCookie: []
