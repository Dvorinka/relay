openapi: 3.1.0
info:
  title: Relay API
  version: 0.1.0
  description: >
    Relay - open-source agent communication & project hub.
    This document is the single source of truth for the HTTP contract;
    the TypeScript client in packages/api-client is generated from it.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8080
    description: local dev
tags:
  - name: auth
  - name: workspaces
  - name: projects
  - name: conversations
  - name: messages
  - name: attachments
  - name: issues
  - name: agents
  - name: mcp
  - name: github
  - name: todos
  - name: ideas
  - name: briefs
  - name: reviews
  - name: webhooks
  - name: realtime
paths:
  /api/health:
    get:
      operationId: health
      summary: Liveness/readiness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string }

  /api/auth/register:
    post:
      operationId: register
      summary: Register a new account
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Registered; session cookie set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/login:
    post:
      operationId: login
      summary: Log in with email and password
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in; session cookie set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/logout:
    post:
      operationId: logout
      summary: Log out and revoke the session
      tags: [auth]
      responses:
        "204": { description: Logged out; session cookie cleared }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/session:
    get:
      operationId: session
      tags: [auth]
      summary: Current session - user plus workspaces
      responses:
        "200":
          description: Active session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/me:
    patch:
      operationId: updateMe
      tags: [auth]
      summary: Update profile fields (chat name color)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name_color:
                  type: string
                  description: "#rrggbb, or empty string to clear"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/browser/start:
    post:
      operationId: browserAuthStart
      summary: Start a browser sign-in flow (desktop shell)
      description: "Mints a one-shot code. The desktop opens {publicUrl}/connect?code=… in the system browser and polls /browser/poll until a signed-in user approves."
      tags: [auth]
      security: []
      responses:
        "201":
          description: Pending sign-in created
          content:
            application/json:
              schema:
                type: object
                required: [code, expires_in]
                properties:
                  code: { type: string }
                  expires_in: { type: integer }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/browser/poll:
    get:
      operationId: browserAuthPoll
      summary: Poll a pending browser sign-in (desktop shell)
      tags: [auth]
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "pending, or approved with a session token (consumed once)"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [pending, approved] }
                  token: { type: string, description: "Present only when approved" }
        "404":
          description: Unknown or expired code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/browser/approve:
    post:
      operationId: browserAuthApprove
      summary: Approve a browser sign-in code (signed-in user)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "204": { description: Approved; token is parked for the polling desktop }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Unknown or expired code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [auth]
      security: []
      summary: Request a password reset token (always 204; never leaks whether the email exists)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "204":
          description: "If the email exists, a reset link was sent"
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a new password from a reset token
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 10 }
      responses:
        "204": { description: Password changed; all sessions revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/password/change:
    post:
      operationId: changePassword
      summary: Change the current password
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10 }
      responses:
        "204": { description: Password changed; other sessions revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces for the current user
      tags: [workspaces]
      responses:
        "200":
          description: Workspaces the current user belongs to
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: "#/components/schemas/WorkspaceWithRole" }
    post:
      operationId: createWorkspace
      summary: Create a workspace
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                slug: { type: string, pattern: "^[a-z0-9-]{2,40}$" }
      responses:
        "201":
          description: Created; caller becomes owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      summary: Get a workspace by id
      tags: [workspaces]
      parameters: [ { $ref: "#/components/parameters/WorkspaceId" } ]
      responses:
        "200":
          description: Workspace detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/members:
    get:
      operationId: listWorkspaceMembers
      summary: List workspace members
      tags: [workspaces]
      parameters: [ { $ref: "#/components/parameters/WorkspaceId" } ]
      responses:
        "200":
          description: Member list
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/WorkspaceMember" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}/invite:
    post:
      operationId: inviteToWorkspace
      summary: Add an existing user to the workspace
      tags: [workspaces]
      description: v1 adds an existing user directly; email invites come later.
      parameters: [ { $ref: "#/components/parameters/WorkspaceId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/WorkspaceRole" }
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMember" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/projects:
    get:
      operationId: listProjects
      summary: Projects across the caller's workspaces
      tags: [projects]
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
    post:
      operationId: createProject
      summary: Create a project in a workspace
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
      responses:
        "201":
          description: Created; caller becomes a project member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/projects/{projectId}:
    get:
      operationId: getProject
      summary: Get a project
      tags: [projects]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateProject
      summary: Update name/description/icon/color
      tags: [projects]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                description: { type: string, maxLength: 2000 }
                icon: { type: ["string", "null"], maxLength: 40 }
                color: { type: ["string", "null"], pattern: "^#[0-9a-fA-F]{6}$" }
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{projectId}/overview:
    get:
      operationId: projectOverview
      summary: Counts plus recent activity for the overview page
      tags: [projects]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      responses:
        "200":
          description: Overview payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectOverview" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{projectId}/statuses:
    put:
      operationId: setProjectStatuses
      summary: Replace the project's issue status lanes (null resets to built-ins)
      tags: [projects]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                statuses:
                  type: ["array", "null"]
                  items: { $ref: "#/components/schemas/StatusDef" }
      responses:
        "200":
          description: Active status list
          content:
            application/json:
              schema:
                type: object
                properties:
                  statuses:
                    type: array
                    items: { $ref: "#/components/schemas/StatusDef" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{projectId}/local_path:
    put:
      operationId: setProjectLocalPath
      summary: Link a local folder on the server host (null clears)
      tags: [projects]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: ["string", "null"] }
      responses:
        "200":
          description: Linked path
          content:
            application/json:
              schema:
                type: object
                properties:
                  local_path: { type: ["string", "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{projectId}/files:
    get:
      operationId: listProjectFiles
      summary: List one directory level of the linked local folder
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: path, in: query, schema: { type: string, default: "" } }
        - { name: recursive, in: query, schema: { type: string, enum: ["1"] },
            description: "Flatten the whole tree into a file-path list (autocomplete)" }
      responses:
        "200":
          description: Directory entries (dirs first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/FileEntry" }
                  truncated: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/files/read:
    get:
      operationId: readProjectFile
      summary: Read a UTF-8 file (<=256KB) from the linked folder
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: File content
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  content: { type: string }
                  size: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/BadRequest" }

  /api/projects/{projectId}/filters:
    get:
      operationId: listSavedFilters
      summary: The caller's saved issue filters for this project
      tags: [projects]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      responses:
        "200":
          description: Saved filters
          content:
            application/json:
              schema:
                type: object
                properties:
                  filters:
                    type: array
                    items: { $ref: "#/components/schemas/SavedFilter" }
    post:
      operationId: createSavedFilter
      summary: Save a named filter
      tags: [projects]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                filters: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Created filter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedFilter" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/projects/{projectId}/filters/{filterId}:
    delete:
      operationId: deleteSavedFilter
      summary: Delete one of the caller's saved filters
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: filterId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties: { deleted: { type: boolean } }

  /api/projects/{projectId}/boards:
    get:
      operationId: listBoards
      summary: Named board views for this project
      tags: [projects]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      responses:
        "200":
          description: Boards
          content:
            application/json:
              schema:
                type: object
                properties:
                  boards:
                    type: array
                    items: { $ref: "#/components/schemas/Board" }
    post:
      operationId: createBoard
      summary: Save a named board view
      tags: [projects]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                filters: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Created board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }

  /api/projects/{projectId}/boards/{boardId}:
    delete:
      operationId: deleteBoard
      summary: Delete a named board
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: boardId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties: { deleted: { type: boolean } }

  /api/projects/{projectId}/briefs:
    get:
      operationId: listBriefs
      summary: List visual briefs in this project
      tags: [briefs]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: issue_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Briefs
          content:
            application/json:
              schema:
                type: object
                properties:
                  briefs:
                    type: array
                    items: { $ref: "#/components/schemas/Brief" }
                  policy: { $ref: "#/components/schemas/BriefPolicy" }
    post:
      operationId: createBrief
      summary: Create a visual brief
      tags: [briefs]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                summary: { type: string }
                issue_id: { type: string, format: uuid }
                scene: { type: object, additionalProperties: true, description: "Excalidraw-compatible scene" }
      responses:
        "201":
          description: Created brief
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Brief" }

  /api/projects/{projectId}/brief-policy:
    post:
      operationId: setBriefPolicy
      summary: Set the project's brief policy
      tags: [briefs]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy]
              properties:
                policy: { $ref: "#/components/schemas/BriefPolicy" }
      responses:
        "200":
          description: Policy set
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy: { $ref: "#/components/schemas/BriefPolicy" }

  /api/briefs/{briefId}:
    get:
      operationId: getBrief
      summary: Get one brief with its scene
      tags: [briefs]
      parameters:
        - { name: briefId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Brief
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Brief" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateBrief
      summary: Update a brief's title, summary, scene, or status
      tags: [briefs]
      parameters:
        - { name: briefId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                summary: { type: string }
                status: { type: string, enum: [open, resolved, archived] }
                scene: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Updated brief
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Brief" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteBrief
      summary: Delete a brief and its comment conversation
      tags: [briefs]
      parameters:
        - { name: briefId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: "Deleted" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/ideas:
    get:
      operationId: listIdeas
      summary: List brainstorm ideas in this project
      tags: [ideas]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Ideas
          content:
            application/json:
              schema:
                type: object
                properties:
                  ideas:
                    type: array
                    items: { $ref: "#/components/schemas/Idea" }
    post:
      operationId: createIdea
      summary: Create a brainstorm idea (title + optional Excalidraw scene)
      tags: [ideas]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                summary: { type: string }
                scene: { type: object, additionalProperties: true, description: "Excalidraw-compatible scene" }
      responses:
        "201":
          description: Created idea
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Idea" }

  /api/workspaces/{workspaceId}/ideas:
    get:
      operationId: listWorkspaceIdeas
      summary: Every idea across the workspace's projects — the Ideas page feed
      tags: [ideas]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
      responses:
        "200":
          description: Ideas
          content:
            application/json:
              schema:
                type: object
                properties:
                  ideas:
                    type: array
                    items: { $ref: "#/components/schemas/Idea" }

  /api/ideas/{ideaId}:
    get:
      operationId: getIdea
      summary: Get one idea with its scene
      tags: [ideas]
      parameters:
        - { name: ideaId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Idea
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Idea" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateIdea
      summary: Update an idea's title, summary, scene, or status
      tags: [ideas]
      parameters:
        - { name: ideaId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                summary: { type: string }
                status: { type: string, enum: [open, converted, archived] }
                scene: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Updated idea
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Idea" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteIdea
      summary: Delete an idea
      tags: [ideas]
      parameters:
        - { name: ideaId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: "Deleted" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/ideas/{ideaId}/convert:
    post:
      operationId: convertIdea
      summary: Turn an idea into a backlog issue or a new project in the same workspace
      tags: [ideas]
      parameters:
        - { name: ideaId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [issue, project] }
                title: { type: string, description: "Defaults to the idea title" }
                description: { type: string, description: "Defaults to the idea summary" }
                key: { type: string, pattern: "^[A-Z0-9]{2,6}$", description: "Required for kind=project" }
      responses:
        "201":
          description: Created issue or project
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      number: { type: integer }
                  project:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      key: { type: string }
                      name: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/briefs/{briefId}/conversation:
    get:
      operationId: briefConversation
      summary: The brief's comment thread (creates it on first access)
      tags: [briefs]
      parameters:
        - { name: briefId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Conversation id usable with /conversations/{id}/messages
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string, format: uuid } }

  /api/projects/{projectId}/github/files:
    get:
      operationId: repoFileTree
      summary: Recursive file tree of a linked GitHub repo
      tags: [github]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: repo, in: query, required: true, schema: { type: string }, description: "owner/name" }
      responses:
        "200":
          description: Tree entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        dir: { type: boolean }
                  truncated: { type: boolean }
                  repo: { type: string }
                  branch: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadRequest" }

  /api/projects/{projectId}/github/files/read:
    get:
      operationId: repoFileRead
      summary: Read a file from a linked GitHub repo
      tags: [github]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: repo, in: query, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: File content
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  content: { type: string }
                  size: { type: integer }
                  repo: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadRequest" }

  /api/push/vapid:
    get:
      operationId: pushVapidKey
      summary: Web-push application server key (enabled=false when unconfigured)
      tags: [push]
      responses:
        "200":
          description: Key info
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  public_key: { type: string }
                  ephemeral: { type: boolean }

  /api/push/subscriptions:
    put:
      operationId: pushSubscribe
      summary: Register (or refresh) a push subscription for the caller
      tags: [push]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string }
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string }
                    auth: { type: string }
      responses:
        "200":
          description: Subscribed
          content:
            application/json:
              schema:
                type: object
                properties: { subscribed: { type: boolean } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/BadRequest" }
    delete:
      operationId: pushUnsubscribe
      summary: Remove a push subscription
      tags: [push]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        "200":
          description: Unsubscribed
          content:
            application/json:
              schema:
                type: object
                properties: { subscribed: { type: boolean } }

  /api/projects/{projectId}/conversation:
    get:
      operationId: projectConversation
      summary: The project's main conversation (created on first access)
      tags: [conversations]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{projectId}/mentionables:
    get:
      operationId: mentionables
      summary: Everything the composer can @-mention in this project
      description: "Workspace members, agents, issues (including GitHub-mirrored issues and PRs), and linked repos for owner/repo#N refs."
      tags: [conversations]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      responses:
        "200":
          description: Mentionable entities
          content:
            application/json:
              schema:
                type: object
                required: [users, agents, issues, repos]
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        avatar_url: { type: ["string", "null"] }
                  agents:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        slug: { type: string }
                        description: { type: string }
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        key: { type: string }
                        title: { type: string }
                        status: { type: string }
                        kind:
                          type: string
                          enum: [issue, github_issue, pull_request]
                        repo: { type: string }
                        github_number: { type: integer }
                        url: { type: string }
                  repos:
                    type: array
                    items: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      summary: Message history, newest last; cursor-paginated backwards
      tags: [conversations]
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
        - name: before
          in: query
          description: Return messages older than this message id
          schema: { type: string, format: uuid }
        - name: tag
          in: query
          description: Only messages carrying this tag
          schema: { type: string }
      responses:
        "200":
          description: Page of messages
          content:
            application/json:
              schema:
                type: object
                required: [messages, has_more]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  has_more: { type: boolean }
                  first_unread_id:
                    type: string
                    format: uuid
                    description: >-
                      Oldest message this user has not read — the "New"
                      divider boundary. Only present on the first page (no
                      `before` cursor) and only when unread messages exist.
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: postMessage
      summary: Send a markdown message as the current user
      tags: [conversations]
      parameters: [ { $ref: "#/components/parameters/ConversationId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 20000
                  description: "May be empty when attachment_ids is non-empty."
                attachment_ids:
                  type: array
                  items: { type: string, format: uuid }
                  maxItems: 20
                parent_id:
                  type: string
                  format: uuid
                  description: Message this reply threads under (same conversation)
                tags:
                  type: array
                  items: { type: string }
                  maxItems: 8
                  description: "Lowercase slugs (frontend, backend, visual, mcp, …); invalid entries are dropped, more than 8 is a 400"
                silent:
                  type: boolean
                  description: >-
                    Post without notifications (the /silent command) — lands
                    in history and unread lists but toasts and push are
                    suppressed unless the body mentions the recipient
      responses:
        "201":
          description: Posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: clearConversation
      summary: Delete every message in the conversation - owner/admin only (the /clear and /new commands)
      tags: [conversations]
      parameters: [ { $ref: "#/components/parameters/ConversationId" } ]
      responses:
        "200": { description: Conversation cleared }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/conversations/{conversationId}/read:
    post:
      operationId: markConversationRead
      summary: Mark every visible message in the conversation read for the current user
      tags: [conversations]
      parameters: [ { $ref: "#/components/parameters/ConversationId" } ]
      responses:
        "204": { description: All messages marked read }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/messages/{messageId}:
    patch:
      operationId: editMessage
      summary: Edit a message's body and append attachments - author only, locked once any agent has read it
      tags: [conversations]
      parameters: [ { $ref: "#/components/parameters/MessageId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 20000 }
                attachment_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: "New ready attachments to append; existing links are preserved"
      responses:
        "200":
          description: Updated message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: An agent has read the message; editing is locked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteMessage
      summary: Soft-delete a message - author only, locked once any agent has read it
      tags: [conversations]
      parameters: [ { $ref: "#/components/parameters/MessageId" } ]
      responses:
        "204": { description: Message deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: An agent has read the message; deletion is locked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/messages/{messageId}/thread:
    post:
      operationId: createThread
      summary: Create (or fetch) the thread rooted at this message
      description: "One thread per message. Title optional - defaults to an excerpt of the parent body. Threads cannot nest; calls on a message inside a thread return 400."
      tags: [conversations]
      parameters: [ { $ref: "#/components/parameters/MessageId" } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Thread already existed
          content:
            application/json:
              schema:
                type: object
                required: [thread]
                properties:
                  thread: { $ref: "#/components/schemas/Thread" }
        "201":
          description: Thread created
          content:
            application/json:
              schema:
                type: object
                required: [thread]
                properties:
                  thread: { $ref: "#/components/schemas/Thread" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/threads:
    get:
      operationId: listThreads
      summary: List a project's threads, most recently active first
      tags: [conversations]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      responses:
        "200":
          description: Thread index
          content:
            application/json:
              schema:
                type: object
                required: [threads]
                properties:
                  threads:
                    type: array
                    items: { $ref: "#/components/schemas/Thread" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/messages/{messageId}/pin:
    put:
      operationId: pinMessage
      summary: Pin a message - any project member may pin
      tags: [conversations]
      parameters: [ { $ref: "#/components/parameters/MessageId" } ]
      responses:
        "200":
          description: Updated message with pinned_at set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: unpinMessage
      summary: Unpin a message
      tags: [conversations]
      parameters: [ { $ref: "#/components/parameters/MessageId" } ]
      responses:
        "200":
          description: Updated message with pinned_at cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/conversations/{conversationId}/pins:
    get:
      operationId: listPins
      summary: Pinned messages in the conversation, most recently pinned first
      tags: [conversations]
      parameters: [ { $ref: "#/components/parameters/ConversationId" } ]
      responses:
        "200":
          description: Pinned messages
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/messages/{messageId}/forward:
    post:
      operationId: forwardMessage
      summary: >-
        Forward a message into another project's conversation. The copy
        credits the original author via `forwarded`; attachments are shared,
        mentions are stripped.
      tags: [conversations]
      parameters: [ { $ref: "#/components/parameters/MessageId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id:
                  type: string
                  format: uuid
                  description: Target project; the caller must be a member
      responses:
        "201":
          description: Forwarded copy in the target conversation
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/messages/{messageId}/reactions:
    put:
      operationId: toggleReaction
      summary: Toggle the caller's emoji reaction on a message
      tags: [conversations]
      parameters: [ { $ref: "#/components/parameters/MessageId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: { type: string, maxLength: 32 }
      responses:
        "200":
          description: Aggregated reactions for the message
          content:
            application/json:
              schema:
                type: object
                required: [reactions]
                properties:
                  reactions:
                    type: array
                    items: { $ref: "#/components/schemas/Reaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{projectId}/attachments:
    post:
      operationId: uploadAttachment
      summary: Upload a file attachment to a project
      tags: [attachments]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
          application/json:
            schema: { $ref: "#/components/schemas/ImageUploadJSON" }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: File exceeds the upload size cap }

  /api/projects/{projectId}/attachments/{attachmentId}/url:
    get:
      operationId: getAttachmentURL
      summary: Redirect to a short-lived presigned download URL
      tags: [attachments]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/AttachmentId" }
      responses:
        "302":
          description: Redirect to the presigned object URL
          headers:
            Location: { schema: { type: string, format: uri } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/attachments/{attachmentId}/download:
    get:
      operationId: downloadAttachment
      summary: Stream the attachment bytes through the API
      description: >-
        Same-origin download for browsers. Prefer this over the presigned
        redirect when the client cannot reach the storage endpoint directly
        (LAN dev environments, private-network access rules).
      tags: [attachments]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/AttachmentId" }
      responses:
        "200":
          description: Attachment bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/messages/{messageId}/read:
    post:
      operationId: markMessageRead
      summary: Record that the current user read this message
      tags: [conversations]
      parameters: [ { $ref: "#/components/parameters/MessageId" } ]
      responses:
        "204": { description: Recorded }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{projectId}/issues:
    get:
      operationId: listIssues
      summary: List issues in a project
      tags: [issues]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/IssueStatus" }
        - name: assignee
          in: query
          description: User id, or "me"
          schema: { type: string }
        - name: label
          in: query
          description: Label id
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description: Substring match on title
          schema: { type: string }
      responses:
        "200":
          description: Issue list
          content:
            application/json:
              schema:
                type: object
                required: [issues]
                properties:
                  issues:
                    type: array
                    items: { $ref: "#/components/schemas/Issue" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createIssue
      summary: Create an issue (keyed PROJECT-N)
      tags: [issues]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 20000 }
                status: { $ref: "#/components/schemas/IssueStatus" }
                priority: { $ref: "#/components/schemas/IssuePriority" }
                assignee_id: { type: string, format: uuid }
                label_ids:
                  type: array
                  items: { type: string, format: uuid }
                  maxItems: 20
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/issues/{issueId}:
    get:
      operationId: getIssue
      summary: Issue detail with labels, assignee and activity
      tags: [issues]
      parameters: [ { $ref: "#/components/parameters/IssueId" } ]
      responses:
        "200":
          description: Issue detail
          content:
            application/json:
              schema:
                type: object
                required: [issue, activity]
                properties:
                  issue: { $ref: "#/components/schemas/Issue" }
                  activity:
                    type: array
                    items: { $ref: "#/components/schemas/IssueActivity" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateIssue
      summary: Update issue fields; changes are recorded in activity
      tags: [issues]
      parameters: [ { $ref: "#/components/parameters/IssueId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 20000 }
                status: { $ref: "#/components/schemas/IssueStatus" }
                priority: { $ref: "#/components/schemas/IssuePriority" }
                assignee_id: { type: ["string", "null"], format: uuid }
                label_ids:
                  type: array
                  items: { type: string, format: uuid }
                  maxItems: 20
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/issues/{issueId}/conversation:
    get:
      operationId: getIssueConversation
      summary: The issue's own conversation thread (auto-created)
      tags: [issues]
      parameters: [ { $ref: "#/components/parameters/IssueId" } ]
      responses:
        "200":
          description: Issue conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/issues/{issueId}/github:
    post:
      operationId: pushIssueToGitHub
      summary: Create a GitHub issue for this Relay issue on the project's linked repo
      tags: [issues]
      parameters: [ { $ref: "#/components/parameters/IssueId" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                repo_id: { type: string, format: uuid, description: "Required when the project links multiple repos" }
      responses:
        "200":
          description: Issue, now with a github link block
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Already linked, or the project has no linked repo" }
        "502": { description: "GitHub rejected the issue" }
        "503": { description: "GitHub app not configured" }

  /api/issues/{issueId}/reviews:
    get:
      operationId: listIssueReviews
      summary: Agent work reviews linked to this issue, newest first
      tags: [reviews]
      parameters: [ { $ref: "#/components/parameters/IssueId" } ]
      responses:
        "200":
          description: Review list
          content:
            application/json:
              schema:
                type: object
                required: [reviews]
                properties:
                  reviews:
                    type: array
                    items: { $ref: "#/components/schemas/AgentReview" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/agents:
    get:
      operationId: listProjectAgents
      summary: List agents holding a grant on a project
      tags: [agents]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}/agents:
    get:
      operationId: listAgents
      summary: List agents in a workspace
      tags: [agents]
      parameters: [ { $ref: "#/components/parameters/WorkspaceId" } ]
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createAgent
      summary: Create an agent identity (owner/admin only)
      tags: [agents]
      parameters: [ { $ref: "#/components/parameters/WorkspaceId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                description: { type: string, maxLength: 500 }
                review_mode: { type: string, enum: [notify, gate], default: notify }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/agents/{agentId}:
    get:
      operationId: getAgent
      summary: Agent detail with project grants
      tags: [agents]
      parameters: [ { $ref: "#/components/parameters/AgentId" } ]
      responses:
        "200":
          description: Agent detail
          content:
            application/json:
              schema:
                type: object
                required: [agent, tokens]
                properties:
                  agent: { $ref: "#/components/schemas/Agent" }
                  tokens:
                    type: array
                    items: { $ref: "#/components/schemas/McpTokenMeta" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateAgent
      summary: Rename/redescribe an agent, or toggle its workspace-wide grant (owner/admin)
      tags: [agents]
      parameters: [ { $ref: "#/components/parameters/AgentId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                description: { type: string, maxLength: 500 }
                review_mode: { type: string, enum: [notify, gate] }
                grant_all:
                  type: boolean
                  description: "true grants every workspace project (incl. future ones) with grant_scopes; false returns to explicit per-project grants"
                grant_scopes:
                  type: array
                  items: { $ref: "#/components/schemas/AgentScope" }
                  description: "Scope set used when grant_all is on; defaults to the standard invite set"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteAgent
      summary: Delete an agent and revoke its tokens (owner/admin)
      tags: [agents]
      parameters: [ { $ref: "#/components/parameters/AgentId" } ]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/agents/{agentId}/projects/{projectId}:
    put:
      operationId: grantAgentProject
      summary: Grant an agent project access with scopes (owner/admin)
      tags: [agents]
      parameters:
        - { $ref: "#/components/parameters/AgentId" }
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                scopes:
                  type: array
                  items: { $ref: "#/components/schemas/AgentScope" }
                  minItems: 1
      responses:
        "200":
          description: Granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: revokeAgentProject
      summary: Revoke an agent's project access (owner/admin)
      tags: [agents]
      parameters:
        - { $ref: "#/components/parameters/AgentId" }
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/agents/{agentId}/tokens:
    post:
      operationId: mintAgentToken
      summary: Mint an MCP token; the secret is returned once (owner/admin)
      tags: [agents]
      parameters: [ { $ref: "#/components/parameters/AgentId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                expires_days:
                  type: integer
                  minimum: 1
                  maximum: 365
      responses:
        "201":
          description: Minted; `token` is shown only in this response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MintedToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/agents/{agentId}/tokens/{tokenId}:
    delete:
      operationId: revokeAgentToken
      summary: Revoke an MCP token (owner/admin)
      tags: [agents]
      parameters:
        - { $ref: "#/components/parameters/AgentId" }
        - { $ref: "#/components/parameters/TokenId" }
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/agent-invites:
    post:
      operationId: createAgentInvite
      summary: Mint a one-shot agent invite; the rli_ token is returned once (owner/admin)
      description: >-
        The user invites; the agent registers itself by redeeming the token at
        POST /api/agent-invites/redeem. Empty project_ids means every workspace
        project, including ones created later; empty scopes means the default full set.
      tags: [agents]
      parameters: [ { $ref: "#/components/parameters/WorkspaceId" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project_ids:
                  type: array
                  items: { type: string, format: uuid }
                scopes:
                  type: array
                  items: { $ref: "#/components/schemas/AgentScope" }
                expires_hours:
                  type: integer
                  minimum: 1
                  maximum: 168
                  default: 72
      responses:
        "201":
          description: Invite created; `token` shown only in this response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AgentInvite"
                  - type: object
                    required: [token]
                    properties:
                      token: { type: string, description: "rli_... - shown once" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      operationId: listAgentInvites
      summary: List invites and their redemption state (owner/admin)
      tags: [agents]
      parameters: [ { $ref: "#/components/parameters/WorkspaceId" } ]
      responses:
        "200":
          description: Invites
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items: { $ref: "#/components/schemas/AgentInvite" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}/agent-invites/{inviteId}:
    delete:
      operationId: deleteAgentInvite
      summary: Revoke an unused invite (owner/admin)
      tags: [agents]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - name: inviteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/agent-invites/redeem:
    post:
      operationId: redeemAgentInvite
      summary: Agent self-registration - redeems an rli_ invite, returns a live rly_ token
      description: >-
        Public endpoint; the invite token is the credential. The agent supplies
        its own name, receives its agent identity, grants, and a working MCP
        token in one response.
      tags: [agents]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name]
              properties:
                token: { type: string, description: "rli_..." }
                name: { type: string, minLength: 1, maxLength: 60 }
                description: { type: string, maxLength: 500 }
                review_mode:
                  type: string
                  enum: [notify, gate]
                  default: notify
      responses:
        "201":
          description: Registered; `token` shown only in this response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRedeemResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: "Invite invalid, used, or expired" }

  /mcp:
    post:
      operationId: mcpEndpoint
      summary: Streamable-HTTP MCP endpoint for external agents
      description: >-
        JSON-RPC MCP surface. Bearer auth with an `rly_` agent token;
        every tool call resolves token -> agent -> project grant -> scope.
      tags: [mcp]
      security: [ { mcpBearer: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "JSON-RPC envelope" }
      responses:
        "200": { description: JSON-RPC response }
        "401": { description: "Missing, revoked, or expired token" }

  /api/github/app:
    get:
      operationId: getGitHubApp
      summary: GitHub App registration status
      tags: [github]
      responses:
        "200": { description: "App status" }
    delete:
      operationId: deleteGitHubApp
      summary: Remove the registered GitHub App
      tags: [github]
      responses:
        "204": { description: "Removed" }

  /api/github/app/manifest:
    post:
      operationId: githubManifest
      summary: Start GitHub App manifest registration
      tags: [github]
      responses:
        "200": { description: "Manifest JSON + post URL" }

  /api/github/callback:
    get:
      operationId: githubCallback
      summary: GitHub app-manifest callback (browser redirect)
      tags: [github]
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        "302": { description: "Redirect back to the app" }

  /api/github/webhook:
    post:
      operationId: githubWebhook
      summary: GitHub webhook receiver (HMAC-verified)
      tags: [github]
      responses:
        "202": { description: "Accepted for processing" }

  /api/workspaces/{workspaceId}/github/installations:
    get:
      operationId: listGitHubInstallations
      summary: GitHub installations for a workspace
      tags: [github]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200": { description: "Installations" }

  /api/workspaces/{workspaceId}/github/repos:
    get:
      operationId: listAvailableRepos
      summary: Repositories reachable via the workspace's installations
      tags: [github]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200": { description: "Installable repositories" }

  /api/projects/{projectId}/github/repos:
    get:
      operationId: listProjectRepos
      summary: Repositories linked to a project
      tags: [github]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: "Linked repositories" }

  /api/projects/{projectId}/github/repo:
    put:
      operationId: linkRepo
      summary: Link a repository to a project
      tags: [github]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [installation_id, owner, name]
              properties:
                installation_id: { type: integer, format: int64 }
                owner: { type: string }
                name: { type: string }
                default_branch: { type: string }
      responses:
        "201": { description: "Linked" }

  /api/projects/{projectId}/github/import:
    post:
      operationId: importGitHub
      summary: Pull the full issue and PR history of linked repos into Relay issues
      description: >
        Admin-only bulk import. Every GitHub issue and pull request on the
        linked repository becomes a Relay issue (prs carry github.kind="pr",
        open PRs land in "review", merged in "done"). Existing mirrors are
        refreshed, not duplicated — safe to re-run. GitHub labels are created
        and linked; Relay-side labels are never removed. Bounded to 500
        objects per kind per repo.
      tags: [github]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                repo_id: { type: string, format: uuid, description: "Import only this linked repo; omit to import all" }
      responses:
        "200":
          description: Per-repo import results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        repo: { type: string }
                        issues:
                          type: object
                          properties:
                            created: { type: integer }
                            updated: { type: integer }
                        prs:
                          type: object
                          properties:
                            created: { type: integer }
                            updated: { type: integer }
                        truncated: { type: boolean, description: "True when the 500-object cap cut the listing short" }
                        error: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Project has no linked GitHub repository" }
        "503": { description: "GitHub app not configured" }

  /api/projects/{projectId}/github/repo/{repoId}:
    delete:
      operationId: unlinkRepo
      summary: Unlink a repository from a project
      tags: [github]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - { name: repoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: "Unlinked" }

  /api/projects/{projectId}/development:
    get:
      operationId: projectDevelopment
      summary: Development panel — open GitHub issues, PRs, recent commits (60s cache)
      tags: [github]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: "Development data" }

  /api/projects/{projectId}/github/pull:
    get:
      operationId: pullDetail
      summary: In-app pull request detail — PR, changed files, commits, CI checks
      tags: [github]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - { name: repo, in: query, schema: { type: string }, description: "owner/name or repo id; optional when only one repo is linked" }
        - { name: number, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Pull request detail bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  pull:
                    type: object
                    description: "number, title, state, draft, merged, mergeable, body, url, author, head, base, additions, deletions, changed_files, commit_count, labels, created_at, updated_at, repo"
                  files:
                    type: array
                    items: { type: object }
                  commits:
                    type: array
                    items: { type: object }
                  checks:
                    type: array
                    items: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: "GitHub upstream error" }

  /api/projects/{projectId}/github/commits:
    get:
      operationId: gitCommits
      summary: Commit log (git log) of a branch on a linked repository
      tags: [github]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - { name: repo, in: query, schema: { type: string }, description: "owner/name or repo id; optional when only one repo is linked" }
        - { name: branch, in: query, schema: { type: string }, description: "Defaults to the repo's default branch" }
        - { name: per_page, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        "200":
          description: Commits, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  commits:
                    type: array
                    items:
                      type: object
                      properties:
                        sha: { type: string }
                        message: { type: string }
                        url: { type: string }
                        author: { type: string }
                        date: { type: string, format: date-time }
                  branch: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: "GitHub upstream error" }

  /api/projects/{projectId}/github/branches:
    get:
      operationId: gitBranches
      summary: Branch list of a linked repository — feeds the git log picker
      tags: [github]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - { name: repo, in: query, schema: { type: string }, description: "owner/name or repo id; optional when only one repo is linked" }
      responses:
        "200":
          description: Branches
          content:
            application/json:
              schema:
                type: object
                properties:
                  branches:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        protected: { type: boolean }
                  default_branch: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: "GitHub upstream error" }

  /api/projects/{projectId}/todos:
    get:
      operationId: listTodos
      summary: Project todo list (agent-managed work tracking)
      tags: [todos]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: "Todos" }
    post:
      operationId: createTodo
      summary: Add a todo item
      tags: [todos]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                issue_id: { type: string, format: uuid }
      responses:
        "201": { description: "Created" }

  /api/todos/{todoId}:
    patch:
      operationId: updateTodo
      summary: Update a todo (content, done, linked issue)
      tags: [todos]
      parameters:
        - { name: todoId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
                done: { type: boolean }
                status:
                  type: string
                  enum: [todo, in_progress, done]
                  description: "Finer-grained state — mirrors a harness task list. Sets done when 'done'."
                issue_id: { type: string }
      responses:
        "200": { description: "Updated" }
    delete:
      operationId: deleteTodo
      summary: Delete a todo
      tags: [todos]
      parameters:
        - { name: todoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: "Deleted" }

  /api/projects/{projectId}/todos/delete:
    post:
      operationId: deleteTodos
      summary: Bulk delete todos in this project (one request, one change event)
      tags: [todos]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: How many rows were deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }

  /api/projects/{projectId}/reviews:
    get:
      operationId: listReviews
      summary: Agent work reviews for the project, newest first
      tags: [reviews]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, changes_requested, superseded] } }
      responses:
        "200":
          description: Reviews + pending count
          content:
            application/json:
              schema:
                type: object
                required: [reviews, pending]
                properties:
                  reviews:
                    type: array
                    items: { $ref: "#/components/schemas/AgentReview" }
                  pending: { type: integer }

  /api/reviews/{reviewId}:
    get:
      operationId: getReview
      summary: One review with status and human response
      tags: [reviews]
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Review
          content:
            application/json:
              schema:
                type: object
                required: [review]
                properties:
                  review: { $ref: "#/components/schemas/AgentReview" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/reviews/{reviewId}/respond:
    post:
      operationId: respondToReview
      summary: Approve a review or send it back with a note
      tags: [reviews]
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, changes_requested] }
                response: { type: string, description: "Required when status is changes_requested" }
      responses:
        "200": { description: "Updated review" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: "Already answered" }

  /api/events:
    get:
      operationId: streamEvents
      summary: Server-sent events for the authenticated user's workspaces
      description: |
        Streams `message.created`, `message.updated`, `message.deleted`,
        `message.read`, `reaction.updated`, `issue.created`,
        `issue.updated`, `todo.changed`, `conversation.cleared` and
        `thread.updated` events as `data:` JSON frames. `message.read`
        carries `{conversation_id, message_ids, agent}` — an agent's named
        read receipt. Events are filtered to projects the caller can
        access. Heartbeat comments every 25s.
      tags: [realtime]
      responses:
        "200":
          description: "text/event-stream"
          content:
            text/event-stream: {}

  /api/agent/attachments/{attachmentId}/download:
    get:
      operationId: downloadAgentAttachment
      summary: Stream attachment bytes to an agent token
      description: >-
        Same-origin download authenticated with an `rly_` bearer token
        (Authorization header or `access_token` query). Requires the
        `attachment:read` scope on the attachment's project. The MCP
        `get_attachment` tool returns this path as `download_url` so agents
        can fetch bytes straight to disk instead of decoding base64.
      tags: [attachments]
      security: [ { mcpBearer: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AttachmentId" }
      responses:
        "200":
          description: Attachment bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: "Object storage not configured" }

  /api/agent/events:
    get:
      operationId: streamAgentEvents
      summary: Server-sent events for an agent token
      description: |
        Same event envelope as `/api/events` but authenticated with an agent
        `rly_` bearer token (Authorization header or `access_token` query —
        EventSource cannot set headers). Events are filtered to projects the
        agent's grant covers, so a harness can mirror todo/issue/message
        state live.
      tags: [realtime]
      responses:
        "200":
          description: "text/event-stream"
          content:
            text/event-stream: {}

  /api/me/avatar:
    put:
      operationId: uploadMyAvatar
      summary: Upload the caller's avatar image (png/jpeg/gif/webp, <=2 MiB)
      tags: [auth]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
          application/json:
            schema: { $ref: "#/components/schemas/ImageUploadJSON" }
      responses:
        "200": { description: "Updated user with avatar_url" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { description: "Exceeds the avatar size cap" }
        "503": { description: "Object storage not configured" }

  /api/agents/{agentId}/avatar:
    put:
      operationId: uploadAgentAvatar
      summary: Upload an agent's logo (owner/admin)
      tags: [agents]
      parameters: [ { $ref: "#/components/parameters/AgentId" } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
          application/json:
            schema: { $ref: "#/components/schemas/ImageUploadJSON" }
      responses:
        "200": { description: "Updated agent with avatar_url" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: "Exceeds the avatar size cap" }
        "503": { description: "Object storage not configured" }

  /api/projects/{projectId}/icon:
    put:
      operationId: uploadProjectIcon
      summary: Upload a project's image icon (any member)
      tags: [projects]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
          application/json:
            schema: { $ref: "#/components/schemas/ImageUploadJSON" }
      responses:
        "200": { description: "Updated project with icon_url" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: "Exceeds the icon size cap" }
        "503": { description: "Object storage not configured" }

  /api/projects/{projectId}/icon/github:
    post:
      operationId: adoptGithubIcon
      summary: >-
        Adopt the linked repository's GitHub owner avatar as the project
        icon. Fetches github.com/<owner>.png server-side.
      tags: [projects]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      responses:
        "200": { description: "Updated project with icon_url" }
        "400": { description: "No repository linked" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { description: "Could not fetch the GitHub avatar" }
        "503": { description: "Object storage not configured" }

  /api/workspaces/{workspaceId}/icon:
    put:
      operationId: uploadWorkspaceIcon
      summary: Upload the workspace's image icon (owner/admin)
      tags: [workspaces]
      parameters:
        - { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
          application/json:
            schema: { $ref: "#/components/schemas/ImageUploadJSON" }
      responses:
        "200": { description: "Updated workspace with avatar_url" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: "Exceeds the icon size cap" }
        "503": { description: "Object storage not configured" }

  /api/files/{key}:
    get:
      operationId: readFile
      summary: >-
        Streams an avatar/icon object. Serves the avatars/ key prefix only;
        pass ?download=1 to force Content-Disposition attachment.
      tags: [attachments]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: download, in: query, schema: { type: string }, description: "Any value forces a download response" }
      responses:
        "200": { description: "File bytes (inline, or attachment when download is set)" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/me/reviews:
    get:
      operationId: myPendingReviews
      summary: Reviews awaiting a verdict across all of the caller's workspaces
      tags: [reviews]
      responses:
        "200":
          description: Inbox feed of pending reviews
          content:
            application/json:
              schema:
                type: object
                required: [reviews]
                properties:
                  reviews:
                    type: array
                    items:
                      type: object
                      required: [id, project_id, title, agent, project_key, project_name, created_at]
                      properties:
                        id: { type: string, format: uuid }
                        project_id: { type: string, format: uuid }
                        title: { type: string }
                        agent:
                          type: object
                          required: [id, name, avatar_url]
                          properties:
                            id: { type: ["string", "null"], format: uuid }
                            name: { type: string }
                            avatar_url: { type: ["string", "null"] }
                        project_key: { type: string }
                        project_name: { type: string }
                        created_at: { type: string, format: date-time }

  /api/projects/{projectId}/webhooks:
    get:
      operationId: listWebhooks
      summary: Webhook subscriptions on this project (secrets are hinted, not shown)
      tags: [webhooks]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      responses:
        "200":
          description: Subscription list + selectable event catalog
          content:
            application/json:
              schema:
                type: object
                required: [webhooks, catalog]
                properties:
                  webhooks:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookSubscription" }
                  catalog:
                    type: array
                    items: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createWebhook
      summary: Subscribe a URL to project events (workspace admin). Returns the signing secret once.
      tags: [webhooks]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                url: { type: string, format: uri, description: "Delivery target; required unless relay_managed" }
                relay_managed:
                  type: boolean
                  description: "True → Relay provisions a built-in listener at /api/webhooks/catch/{id} and points the subscription at it; deliveries are recorded and inspectable without standing up a server"
                events:
                  type: array
                  items: { type: string }
                  description: "Event names from the catalog, 'prefix.*' wildcards, or '*'"
                active: { type: boolean }
      responses:
        "201":
          description: Created - the `secret` field is included only in this response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookSubscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/webhooks/{webhookId}:
    get:
      operationId: getWebhook
      summary: One webhook subscription
      tags: [webhooks]
      parameters: [ { $ref: "#/components/parameters/WebhookId" } ]
      responses:
        "200":
          description: The subscription (no secret)
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook: { $ref: "#/components/schemas/WebhookSubscription" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateWebhook
      summary: Update url/events/active (workspace admin)
      tags: [webhooks]
      parameters: [ { $ref: "#/components/parameters/WebhookId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                events: { type: array, items: { type: string } }
                active: { type: boolean }
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook: { $ref: "#/components/schemas/WebhookSubscription" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteWebhook
      summary: Remove a subscription (workspace admin)
      tags: [webhooks]
      parameters: [ { $ref: "#/components/parameters/WebhookId" } ]
      responses:
        "204": { description: "Deleted" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/webhooks/{webhookId}/deliveries:
    get:
      operationId: webhookDeliveries
      summary: Recent delivery attempts (newest 50)
      tags: [webhooks]
      parameters: [ { $ref: "#/components/parameters/WebhookId" } ]
      responses:
        "200":
          description: Delivery log
          content:
            application/json:
              schema:
                type: object
                required: [deliveries]
                properties:
                  deliveries:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookDelivery" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/webhooks/{webhookId}/test:
    post:
      operationId: testWebhook
      summary: Queue a synthetic webhook.test delivery through the real pipeline
      tags: [webhooks]
      parameters: [ { $ref: "#/components/parameters/WebhookId" } ]
      responses:
        "202": { description: "Delivery queued" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/webhooks/catch/{webhookId}:
    post:
      operationId: webhookCatch
      summary: Public listener endpoint for relay_managed subscriptions — accepts the signed envelope, always 204
      tags: [webhooks]
      parameters: [ { $ref: "#/components/parameters/WebhookId" } ]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "204": { description: "Accepted" }

  /api/me/unread:
    get:
      operationId: unreadCounts
      summary: Per-project unread message counts plus the per-conversation breakdown
      tags: [realtime]
      responses:
        "200":
          description: "unread: project_id -> count; reviews: project_id -> pending count; conversations: per-conversation unread detail for deep links"
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread:
                    type: object
                    additionalProperties: { type: integer }
                  reviews:
                    type: object
                    additionalProperties: { type: integer }
                  conversations:
                    type: array
                    items:
                      type: object
                      properties:
                        conversation_id: { type: string, format: uuid }
                        project_id: { type: string, format: uuid }
                        kind: { type: string, enum: [project, issue, brief, thread] }
                        unread: { type: integer }
                        first_unread_id: { type: string, format: uuid }
                        issue_id: { type: string, format: uuid }
                        issue_number: { type: integer }
                        issue_title: { type: string }
                        brief_id: { type: string, format: uuid }
                        brief_title: { type: string }
                        parent_message_id: { type: string, format: uuid }
                        title: { type: string }
                        snippet: { type: string, description: "Preview of the oldest unread message (<=140 chars)" }
                        author_name: { type: string }
                        first_unread_at: { type: string, format: date-time }
                      required: [conversation_id, project_id, kind, unread]

  /api/search:
    get:
      operationId: search
      summary: Global full-text search over messages, issues, projects, todos
      tags: [search]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 200 } }
      responses:
        "200": { description: "Grouped, ranked results" }

  /api/me/activity:
    get:
      operationId: myActivity
      summary: Cross-project dashboard feed — open issues, open GitHub PRs, latest messages
      tags: [realtime]
      responses:
        "200":
          description: "open_issues/open_prs: recently-touched open work; recent_messages: newest messages across all visible projects"
          content:
            application/json:
              schema:
                type: object
                required: [open_issues, open_prs, recent_messages]
                properties:
                  open_issues:
                    type: array
                    items: { $ref: "#/components/schemas/ActivityIssue" }
                  open_prs:
                    type: array
                    items: { $ref: "#/components/schemas/ActivityIssue" }
                  recent_messages:
                    type: array
                    items: { $ref: "#/components/schemas/ActivityMessage" }

  /api/me/mentions:
    get:
      operationId: mentions
      summary: Messages mentioning the caller (@name), newest first
      tags: [realtime]
      responses:
        "200": { description: "Mention feed" }

  /api/users/{userId}/profile:
    get:
      operationId: userProfile
      summary: User details visible to the caller — profile plus activity inside workspaces both parties share
      tags: [realtime]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "Profile, shared workspaces, stats, assigned issues, recent messages, mentions" }
        "404": { description: "No shared workspace — or no such user" }

  /api/projects/{projectId}/issues/key/{key}:
    get:
      operationId: issueByKey
      summary: Resolve a KEY-42 issue key to its id (for linkification)
      tags: [issues]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Issue id" }
        "404": { description: "Not found" }

  /api/messages/{messageId}/issue:
    post:
      operationId: createIssueFromMessage
      summary: Turn a message into an issue in its project
      tags: [issues]
      parameters: [ { $ref: "#/components/parameters/MessageId" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Created; body and attachments are copied to the issue thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/labels:
    get:
      operationId: listLabels
      summary: List a project's labels
      tags: [issues]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      responses:
        "200":
          description: Label list
          content:
            application/json:
              schema:
                type: object
                required: [labels]
                properties:
                  labels:
                    type: array
                    items: { $ref: "#/components/schemas/Label" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createLabel
      summary: Create a project label
      tags: [issues]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
                color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: relay_session
    mcpBearer:
      type: http
      scheme: bearer
      description: Agent MCP token (rly_...), evaluated on /mcp and /api/agent/* endpoints.
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IssueId:
      name: issueId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicts with existing state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        name_color:
          type: ["string", "null"]
          description: Chat name color as #rrggbb; null = palette default.
        avatar_url: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10 }
        name: { type: string, minLength: 1, maxLength: 80 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AuthSession:
      type: object
      required: [user, workspaces]
      properties:
        user: { $ref: "#/components/schemas/User" }
        workspaces:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceWithRole" }
        token:
          type: string
          description: >-
            Session bearer token, returned by login/register only. Clients
            hosted off-origin (local-mode SPA syncing to a server) send it as
            `Authorization: Bearer <token>` since cookies are same-origin.

    Workspace:
      type: object
      required: [id, name, slug, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        avatar_url:
          type: ["string", "null"]
          description: "Workspace icon via /api/files/; append ?download=1 to fetch as attachment"
        created_at: { type: string, format: date-time }

    WorkspaceWithRole:
      allOf:
        - $ref: "#/components/schemas/Workspace"
        - type: object
          required: [role]
          properties:
            role: { $ref: "#/components/schemas/WorkspaceRole" }

    WorkspaceRole:
      type: string
      enum: [owner, admin, member]

    WorkspaceMember:
      type: object
      required: [user, role]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/WorkspaceRole" }

    Project:
      type: object
      required: [id, workspace_id, key, name, description, created_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        key: { type: string, pattern: "^[A-Z0-9]{2,6}$" }
        name: { type: string }
        description: { type: string }
        icon: { type: ["string", "null"] }
        icon_url:
          type: ["string", "null"]
          description: "Image icon via /api/files/; append ?download=1 to fetch as attachment"
        color: { type: ["string", "null"], pattern: "^#[0-9a-fA-F]{6}$" }
        statuses:
          type: array
          description: Issue lanes for this project; built-in six when unset
          items: { $ref: "#/components/schemas/StatusDef" }
        local_path: { type: ["string", "null"], description: "Linked local folder on the server host" }
        brief_policy: { $ref: "#/components/schemas/BriefPolicy" }
        created_at: { type: string, format: date-time }
        last_activity_at:
          type: string
          format: date-time
          description: "Newest message or issue activity; projects list only"
        open_issues:
          type: integer
          description: "Issues not in a closed status; projects list only"
        open_prs:
          type: integer
          description: "Open GitHub-linked pull requests; projects list only"
        members:
          type: integer
          description: "Project member count; projects list only"

    ActivityIssue:
      type: object
      required: [id, project_id, key, title, status, priority, updated_at, project_key, project_name]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        key: { type: string, description: "Computed key, e.g. REL-42" }
        title: { type: string }
        status: { type: string }
        priority: { type: string }
        updated_at: { type: string, format: date-time }
        project_key: { type: string }
        project_name: { type: string }

    ActivityMessage:
      type: object
      required: [id, body, created_at, conversation_id, conversation_kind, project_id, project_key, project_name, author]
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        created_at: { type: string, format: date-time }
        conversation_id: { type: string, format: uuid }
        conversation_kind: { type: string, enum: [project, issue, brief, thread] }
        project_id: { type: string, format: uuid }
        project_key: { type: string }
        project_name: { type: string }
        author:
          type: object
          required: [name, kind]
          properties:
            name: { type: string }
            kind: { type: string, enum: [user, agent] }

    Idea:
      type: object
      required: [id, project_id, title, summary, scene, status]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        project_key: { type: string }
        project_name: { type: string }
        title: { type: string }
        summary: { type: string }
        scene: { type: object, additionalProperties: true, description: "Excalidraw-compatible scene JSON" }
        status: { type: string, enum: [open, converted, archived] }
        author_name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BriefPolicy:
      type: string
      enum: [never, on_request, pre_merge]
      description: |
        When agents should produce visual briefs. 'never' forbids them,
        'on_request' creates only when asked, 'pre_merge' expects one before
        merge-worthy reviews are approved.

    Brief:
      type: object
      required: [id, project_id, title, summary, scene, status]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        issue_id: { type: ["string", "null"], format: uuid }
        conversation_id: { type: ["string", "null"], format: uuid, description: "Comment thread; messages via /conversations/{id}/messages" }
        title: { type: string }
        summary: { type: string }
        scene: { type: object, additionalProperties: true, description: "Excalidraw-compatible scene JSON" }
        status: { type: string, enum: [open, resolved, archived] }
        author_name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StatusDef:
      type: object
      required: [id, label, color]
      properties:
        id: { type: string, pattern: "^[a-z0-9_-]{1,32}$" }
        label: { type: string, minLength: 1, maxLength: 40 }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        closed: { type: boolean, description: "Terminal state (maps to GitHub closed)" }

    SavedFilter:
      type: object
      required: [id, name, filters]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        filters: { type: object, additionalProperties: true }

    Board:
      type: object
      required: [id, name, filters]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        filters: { type: object, additionalProperties: true }

    FileEntry:
      type: object
      required: [name, path, dir]
      properties:
        name: { type: string }
        path: { type: string }
        dir: { type: boolean }
        size: { type: integer }

    CreateProjectRequest:
      type: object
      required: [workspace_id, key, name]
      properties:
        workspace_id: { type: string, format: uuid }
        key:
          type: string
          pattern: "^[A-Z0-9]{2,6}$"
          description: Issue-key prefix, e.g. MYB
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 2000 }
        icon: { type: ["string", "null"], maxLength: 40 }
        color: { type: ["string", "null"], pattern: "^#[0-9a-fA-F]{6}$" }

    Conversation:
      type: object
      required: [id, project_id, kind, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        kind: { type: string, enum: [project, issue, brief, thread] }
        issue_id: { type: ["string", "null"], format: uuid }
        brief_id: { type: ["string", "null"], format: uuid }
        created_at: { type: string, format: date-time }

    MessageAuthor:
      type: object
      required: [kind, id, name]
      properties:
        kind: { type: string, enum: [user, agent] }
        id: { type: string, format: uuid }
        name: { type: string }
        avatar_url: { type: ["string", "null"] }

    Attachment:
      type: object
      required: [id, project_id, filename, content_type, size_bytes, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    ImageUploadJSON:
      type: object
      description: >-
        JSON alternative to multipart on image-upload endpoints.
        `url` makes the server fetch and store the image (public http(s)
        hosts only); `name` + `data` is the desktop app's base64 upload
        bridge.
      properties:
        url:
          type: string
          format: uri
          description: http(s) image URL the server downloads and stores
        name: { type: string, description: Filename for base64 uploads }
        data:
          type: string
          format: byte
          description: Base64-encoded file bytes

    MessageParent:
      type: object
      required: [id, author, preview, deleted]
      properties:
        id: { type: string, format: uuid }
        author: { type: string }
        preview: { type: string, description: "Plain-text snippet; empty when deleted" }
        deleted: { type: boolean }

    Reaction:
      type: object
      required: [emoji, count, mine, names]
      properties:
        emoji: { type: string }
        count: { type: integer }
        mine: { type: boolean, description: "The caller reacted with this emoji" }
        names:
          type: array
          items: { type: string }
          description: "Up to 8 reactor display names, oldest first"

    ReadReceipt:
      type: object
      required: [id, name, avatar_url, read_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        avatar_url: { type: ["string", "null"] }
        read_at: { type: string, format: date-time }
      description: "One agent that has read the message (the author's own receipt is excluded)"

    Message:
      type: object
      required: [id, conversation_id, author, body, attachments, reactions, created_at, agent_read]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/MessageAuthor" }
        body: { type: string, description: Markdown }
        tags:
          type: array
          description: "Free-form classification tags (frontend, backend, visual, mcp, …); lowercase slug, max 8"
          items: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,23}$" }
        silent:
          type: boolean
          description: "Agent progress update posted without notifications — clients should not toast it"
        mentions:
          type: array
          description: "Structured entity references extracted from the body"
          items: { $ref: "#/components/schemas/MentionRef" }
        parent:
          anyOf:
            - $ref: "#/components/schemas/MessageParent"
            - type: "null"
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        reactions:
          type: array
          items: { $ref: "#/components/schemas/Reaction" }
        created_at: { type: string, format: date-time }
        edited_at: { type: ["string", "null"], format: date-time }
        agent_read:
          type: boolean
          description: "True once at least one agent has read the message; edits are then rejected with 409"
        read_by:
          type: array
          description: "Agents that have read the message, oldest read first — the named receipt row"
          items: { $ref: "#/components/schemas/ReadReceipt" }
        thread:
          anyOf:
            - $ref: "#/components/schemas/ThreadSummary"
            - type: "null"
          description: "Thread rooted at this message, when one exists"
        pinned_at:
          type: ["string", "null"]
          format: date-time
          description: "Set while the message is pinned to the conversation"
        forwarded:
          anyOf:
            - $ref: "#/components/schemas/MessageForwarded"
            - type: "null"
          description: "Present on forwarded copies; credits the original message"

    MessageForwarded:
      type: object
      required: [message_id, conversation_id, author]
      properties:
        message_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        author: { type: string, description: "Original author's display name" }

    ThreadSummary:
      type: object
      required: [id, title, reply_count]
      description: "Thread pointer embedded on a message"
      properties:
        id: { type: string, format: uuid, description: "the thread's conversation id" }
        title: { type: ["string", "null"], maxLength: 120 }
        reply_count: { type: integer }

    Thread:
      type: object
      required: [id, parent_message_id, parent_conversation, title, reply_count, created_at]
      properties:
        id: { type: string, format: uuid, description: "the thread's conversation id" }
        parent_message_id: { type: string, format: uuid }
        parent_conversation: { type: string, format: uuid }
        title: { type: ["string", "null"], maxLength: 120 }
        reply_count: { type: integer }
        created_by: { type: string }
        parent:
          type: object
          properties:
            author: { type: string }
            preview: { type: string }
        last_reply_at: { type: ["string", "null"], format: date-time }
        created_at: { type: string, format: date-time }

    MentionRef:
      type: object
      required: [kind, ref, label]
      properties:
        kind:
          type: string
          enum: [user, agent, issue, gh, file, thread]
          description: "user|agent|issue|gh|file|thread — @user:, @agent:, KEY-N, owner/repo#N, @file:/@gh:, or a thread link on a 'started a thread' notice"
        ref: { type: string, description: "slug | KEY-1 | owner/repo#1 | path | thread conversation id" }
        label: { type: string }
        id: { type: string, description: "resolved entity uuid when found" }
        url: { type: string }
        found: { type: boolean }

    IssueStatus:
      type: string
      description: "Built-in lane id or a project's custom status id"

    IssuePriority:
      type: string
      enum: [none, urgent, high, medium, low]

    Label:
      type: object
      required: [id, project_id, name, color]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }

    Issue:
      type: object
      required: [id, project_id, number, key, title, description, status, priority, labels, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        number: { type: integer }
        key: { type: string, description: "PROJECTKEY-number, e.g. AT-1" }
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/IssueStatus" }
        priority: { $ref: "#/components/schemas/IssuePriority" }
        assignee:
          anyOf:
            - $ref: "#/components/schemas/MessageAuthor"
            - type: "null"
        labels:
          type: array
          items: { $ref: "#/components/schemas/Label" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        origin: { type: string, enum: [relay, github], description: "relay = native, github = mirrored from a linked repository" }
        github:
          type: object
          description: "Present when the issue mirrors a GitHub issue or PR"
          properties:
            repo: { type: string, description: "owner/name" }
            number: { type: integer }
            kind: { type: string, enum: [issue, pr] }
            state: { type: string, enum: [open, closed, merged], description: "GitHub's raw state" }
            url: { type: string }

    IssueActivity:
      type: object
      required: [id, kind, actor, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, description: "created | status_changed | field_changed | commented | from_message" }
        actor:
          anyOf:
            - $ref: "#/components/schemas/MessageAuthor"
            - type: "null"
        payload:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }

    AgentScope:
      type: string
      enum:
        - project:read
        - message:read
        - message:write
        - attachment:read
        - attachment:write
        - issue:read
        - issue:write
        - review:read
        - review:write
        - file:read
        - brief:read
        - brief:write

    AgentGrant:
      type: object
      required: [project_id, project_key, project_name, scopes]
      properties:
        project_id: { type: string, format: uuid }
        project_key: { type: string }
        project_name: { type: string }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/AgentScope" }

    Agent:
      type: object
      required: [id, workspace_id, name, slug, description, grants, review_mode, created_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        avatar_url: { type: ["string", "null"] }
        review_mode:
          type: string
          enum: [notify, gate]
          description: "gate: agent must wait for a human verdict on each review; notify: reviews are informational."
        grant_all:
          type: boolean
          description: "Workspace-wide grant - every current and future project with grant_scopes"
        grant_scopes:
          type: array
          items: { $ref: "#/components/schemas/AgentScope" }
          description: "Scope set applied by grant_all; also the fallback scopes in project agent listings"
        grants:
          type: array
          items: { $ref: "#/components/schemas/AgentGrant" }
        last_seen_at:
          type: ["string", "null"]
          format: date-time
          description: Last authenticated MCP call; null means never seen.
        created_at: { type: string, format: date-time }

    AgentReview:
      type: object
      description: |
        Structured agent work report. The shape is fixed so every review
        renders the same board: summary, per-file changes, autonomous
        decisions, required human actions, verification, links.
      required: [id, project_id, status, title, summary, files, decisions, actions, links, verify, agent, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, changes_requested, superseded] }
        title: { type: string }
        summary: { type: string, description: Plain-language markdown }
        files:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              status: { type: string, enum: [added, modified, deleted, renamed] }
              additions: { type: integer }
              deletions: { type: integer }
              note: { type: string, description: One-line plain-English description of the change }
              patch: { type: string, description: Optional unified diff hunk }
        decisions:
          type: array
          items:
            type: object
            properties:
              decision: { type: string }
              rationale: { type: string }
        actions:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [env, config, deploy, ci, secret, migration, other] }
              label: { type: string }
              detail: { type: string }
        links:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              url: { type: string }
        verify: { type: string, description: Markdown steps to confirm the change works }
        agent:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            avatar_url: { type: ["string", "null"] }
        issue:
          type: ["object", "null"]
          properties:
            id: { type: string }
            key: { type: string }
        supersedes: { type: ["string", "null"], format: uuid }
        responder:
          type: ["object", "null"]
          properties:
            id: { type: string }
            name: { type: string }
            avatar_url: { type: ["string", "null"] }
        response: { type: string }
        responded_at: { type: ["string", "null"], format: date-time }
        created_at: { type: string, format: date-time }

    WebhookSubscription:
      type: object
      description: >-
        Outbound event subscription. POSTs an HMAC-SHA256 signed JSON envelope
        (X-Relay-Signature-256) to url for each matching project event.
      required: [id, project_id, url, events, active, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        url: { type: string, format: uri }
        events:
          type: array
          items: { type: string }
        active: { type: boolean }
        secret: { type: string, description: "whsec_... — only present on create" }
        secret_hint: { type: string, description: "whsec_…XXXX shown on list/get" }
        created_at: { type: string, format: date-time }

    WebhookDelivery:
      type: object
      required: [id, delivery_id, event_type, attempts, duration_ms, success, created_at]
      properties:
        id: { type: string, format: uuid }
        delivery_id: { type: string, format: uuid }
        event_type: { type: string }
        status_code: { type: ["integer", "null"] }
        attempts: { type: integer }
        duration_ms: { type: integer }
        success: { type: boolean }
        created_at: { type: string, format: date-time }

    McpTokenMeta:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        last_used_at: { type: ["string", "null"], format: date-time }
        expires_at: { type: ["string", "null"], format: date-time }
        created_at: { type: string, format: date-time }

    MintedToken:
      allOf:
        - $ref: "#/components/schemas/McpTokenMeta"
        - type: object
          required: [token]
          properties:
            token: { type: string, description: "rly_... - shown once" }

    AgentInvite:
      type: object
      required: [id, project_ids, scopes, expires_at, used_by, created_at]
      properties:
        id: { type: string, format: uuid }
        project_ids:
          type: array
          items: { type: string, format: uuid }
          description: "Empty = every workspace project, including ones created later."
        scopes:
          type: array
          items: { $ref: "#/components/schemas/AgentScope" }
        expires_at: { type: string, format: date-time }
        used_by:
          type: ["object", "null"]
          properties:
            agent_id: { type: string, format: uuid }
            name: { type: string }
        created_by:
          type: string
          description: "Display name of the user who minted the invite"
        created_at: { type: string, format: date-time }

    AgentRedeemResult:
      type: object
      required: [agent, token, mcp_url, api_url]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        token: { type: string, description: "rly_... - shown once" }
        mcp_url: { type: string }
        api_url: { type: string }

    ProjectOverview:
      type: object
      required: [project, counts, recent_messages]
      properties:
        project: { $ref: "#/components/schemas/Project" }
        counts:
          type: object
          required: [members, messages, conversations]
          properties:
            members: { type: integer }
            messages: { type: integer }
            conversations: { type: integer }
        recent_messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        issue_activity:
          type: array
          description: "Latest issue events across the project, newest first"
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              issue_id: { type: string, format: uuid }
              issue_number: { type: integer }
              issue_title: { type: string }
              kind: { type: string }
              payload: { type: object, additionalProperties: true }
              actor: { type: string }
              created_at: { type: string, format: date-time }
security:
  - sessionCookie: []
