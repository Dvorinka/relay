openapi: 3.1.0
info:
  title: Relay API
  version: 0.1.0
  description: >
    Relay - open-source agent communication & project hub.
    This document is the single source of truth for the HTTP contract;
    the TypeScript client in packages/api-client is generated from it.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8080
    description: local dev
tags:
  - name: auth
  - name: workspaces
  - name: projects
  - name: conversations
paths:
  /api/health:
    get:
      operationId: health
      summary: Liveness/readiness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string }

  /api/auth/register:
    post:
      operationId: register
      summary: Register a new account
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Registered; session cookie set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/login:
    post:
      operationId: login
      summary: Log in with email and password
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in; session cookie set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/logout:
    post:
      operationId: logout
      summary: Log out and revoke the session
      tags: [auth]
      responses:
        "204": { description: Logged out; session cookie cleared }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/session:
    get:
      operationId: session
      tags: [auth]
      summary: Current session - user plus workspaces
      responses:
        "200":
          description: Active session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [auth]
      security: []
      summary: Request a password reset token (always 204; never leaks whether the email exists)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "204":
          description: "If the email exists, a reset link was sent"
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a new password from a reset token
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 10 }
      responses:
        "204": { description: Password changed; all sessions revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/password/change:
    post:
      operationId: changePassword
      summary: Change the current password
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10 }
      responses:
        "204": { description: Password changed; other sessions revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces for the current user
      tags: [workspaces]
      responses:
        "200":
          description: Workspaces the current user belongs to
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: "#/components/schemas/WorkspaceWithRole" }
    post:
      operationId: createWorkspace
      summary: Create a workspace
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                slug: { type: string, pattern: "^[a-z0-9-]{2,40}$" }
      responses:
        "201":
          description: Created; caller becomes owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      summary: Get a workspace by id
      tags: [workspaces]
      parameters: [ { $ref: "#/components/parameters/WorkspaceId" } ]
      responses:
        "200":
          description: Workspace detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{workspaceId}/members:
    get:
      operationId: listWorkspaceMembers
      summary: List workspace members
      tags: [workspaces]
      parameters: [ { $ref: "#/components/parameters/WorkspaceId" } ]
      responses:
        "200":
          description: Member list
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/WorkspaceMember" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces/{workspaceId}/invite:
    post:
      operationId: inviteToWorkspace
      summary: Add an existing user to the workspace
      tags: [workspaces]
      description: v1 adds an existing user directly; email invites come later.
      parameters: [ { $ref: "#/components/parameters/WorkspaceId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/WorkspaceRole" }
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMember" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/projects:
    get:
      operationId: listProjects
      summary: Projects across the caller's workspaces
      tags: [projects]
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
    post:
      operationId: createProject
      summary: Create a project in a workspace
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
      responses:
        "201":
          description: Created; caller becomes a project member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/projects/{projectId}:
    get:
      operationId: getProject
      summary: Get a project
      tags: [projects]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateProject
      summary: Update name/description/icon/color
      tags: [projects]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                description: { type: string, maxLength: 2000 }
                icon: { type: ["string", "null"], maxLength: 40 }
                color: { type: ["string", "null"], pattern: "^#[0-9a-fA-F]{6}$" }
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{projectId}/overview:
    get:
      operationId: projectOverview
      summary: Counts plus recent activity for the overview page
      tags: [projects]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      responses:
        "200":
          description: Overview payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectOverview" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{projectId}/conversation:
    get:
      operationId: projectConversation
      summary: The project's main conversation (created on first access)
      tags: [conversations]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      summary: Message history, newest last; cursor-paginated backwards
      tags: [conversations]
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
        - name: before
          in: query
          description: Return messages older than this message id
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Page of messages
          content:
            application/json:
              schema:
                type: object
                required: [messages, has_more]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  has_more: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: postMessage
      summary: Send a markdown message as the current user
      tags: [conversations]
      parameters: [ { $ref: "#/components/parameters/ConversationId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 20000 }
                attachment_ids:
                  type: array
                  items: { type: string, format: uuid }
                  maxItems: 20
      responses:
        "201":
          description: Posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{projectId}/attachments:
    post:
      operationId: uploadAttachment
      summary: Upload a file attachment to a project
      tags: [attachments]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: File exceeds the upload size cap }

  /api/projects/{projectId}/attachments/{attachmentId}/url:
    get:
      operationId: getAttachmentURL
      summary: Redirect to a short-lived presigned download URL
      tags: [attachments]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/AttachmentId" }
      responses:
        "302":
          description: Redirect to the presigned object URL
          headers:
            Location: { schema: { type: string, format: uri } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/messages/{messageId}/read:
    post:
      operationId: markMessageRead
      summary: Record that the current user read this message
      tags: [conversations]
      parameters: [ { $ref: "#/components/parameters/MessageId" } ]
      responses:
        "204": { description: Recorded }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{projectId}/issues:
    get:
      operationId: listIssues
      summary: List issues in a project
      tags: [issues]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/IssueStatus" }
        - name: assignee
          in: query
          description: User id, or "me"
          schema: { type: string }
        - name: label
          in: query
          description: Label id
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description: Substring match on title
          schema: { type: string }
      responses:
        "200":
          description: Issue list
          content:
            application/json:
              schema:
                type: object
                required: [issues]
                properties:
                  issues:
                    type: array
                    items: { $ref: "#/components/schemas/Issue" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createIssue
      summary: Create an issue (keyed PROJECT-N)
      tags: [issues]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 20000 }
                status: { $ref: "#/components/schemas/IssueStatus" }
                priority: { $ref: "#/components/schemas/IssuePriority" }
                assignee_id: { type: string, format: uuid }
                label_ids:
                  type: array
                  items: { type: string, format: uuid }
                  maxItems: 20
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/issues/{issueId}:
    get:
      operationId: getIssue
      summary: Issue detail with labels, assignee and activity
      tags: [issues]
      parameters: [ { $ref: "#/components/parameters/IssueId" } ]
      responses:
        "200":
          description: Issue detail
          content:
            application/json:
              schema:
                type: object
                required: [issue, activity]
                properties:
                  issue: { $ref: "#/components/schemas/Issue" }
                  activity:
                    type: array
                    items: { $ref: "#/components/schemas/IssueActivity" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateIssue
      summary: Update issue fields; changes are recorded in activity
      tags: [issues]
      parameters: [ { $ref: "#/components/parameters/IssueId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 20000 }
                status: { $ref: "#/components/schemas/IssueStatus" }
                priority: { $ref: "#/components/schemas/IssuePriority" }
                assignee_id: { type: ["string", "null"], format: uuid }
                label_ids:
                  type: array
                  items: { type: string, format: uuid }
                  maxItems: 20
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/issues/{issueId}/conversation:
    get:
      operationId: getIssueConversation
      summary: The issue's own conversation thread (auto-created)
      tags: [issues]
      parameters: [ { $ref: "#/components/parameters/IssueId" } ]
      responses:
        "200":
          description: Issue conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/messages/{messageId}/issue:
    post:
      operationId: createIssueFromMessage
      summary: Turn a message into an issue in its project
      tags: [issues]
      parameters: [ { $ref: "#/components/parameters/MessageId" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Created; body and attachments are copied to the issue thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/labels:
    get:
      operationId: listLabels
      summary: List a project's labels
      tags: [issues]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      responses:
        "200":
          description: Label list
          content:
            application/json:
              schema:
                type: object
                required: [labels]
                properties:
                  labels:
                    type: array
                    items: { $ref: "#/components/schemas/Label" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createLabel
      summary: Create a project label
      tags: [issues]
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
                color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: relay_session
    mcpBearer:
      type: http
      scheme: bearer
      description: Agent MCP token (rly_...), evaluated on the /mcp endpoint only.
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IssueId:
      name: issueId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicts with existing state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        avatar_url: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10 }
        name: { type: string, minLength: 1, maxLength: 80 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AuthSession:
      type: object
      required: [user, workspaces]
      properties:
        user: { $ref: "#/components/schemas/User" }
        workspaces:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceWithRole" }

    Workspace:
      type: object
      required: [id, name, slug, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        created_at: { type: string, format: date-time }

    WorkspaceWithRole:
      allOf:
        - $ref: "#/components/schemas/Workspace"
        - type: object
          required: [role]
          properties:
            role: { $ref: "#/components/schemas/WorkspaceRole" }

    WorkspaceRole:
      type: string
      enum: [owner, admin, member]

    WorkspaceMember:
      type: object
      required: [user, role]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/WorkspaceRole" }

    Project:
      type: object
      required: [id, workspace_id, key, name, description, created_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        key: { type: string, pattern: "^[A-Z0-9]{2,6}$" }
        name: { type: string }
        description: { type: string }
        icon: { type: ["string", "null"] }
        color: { type: ["string", "null"], pattern: "^#[0-9a-fA-F]{6}$" }
        created_at: { type: string, format: date-time }

    CreateProjectRequest:
      type: object
      required: [workspace_id, key, name]
      properties:
        workspace_id: { type: string, format: uuid }
        key:
          type: string
          pattern: "^[A-Z0-9]{2,6}$"
          description: Issue-key prefix, e.g. MYB
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 2000 }
        icon: { type: ["string", "null"], maxLength: 40 }
        color: { type: ["string", "null"], pattern: "^#[0-9a-fA-F]{6}$" }

    Conversation:
      type: object
      required: [id, project_id, kind, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        kind: { type: string, enum: [project, issue] }
        issue_id: { type: ["string", "null"], format: uuid }
        created_at: { type: string, format: date-time }

    MessageAuthor:
      type: object
      required: [kind, id, name]
      properties:
        kind: { type: string, enum: [user, agent] }
        id: { type: string, format: uuid }
        name: { type: string }
        avatar_url: { type: ["string", "null"] }

    Attachment:
      type: object
      required: [id, project_id, filename, content_type, size_bytes, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    Message:
      type: object
      required: [id, conversation_id, author, body, attachments, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/MessageAuthor" }
        body: { type: string, description: Markdown }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        created_at: { type: string, format: date-time }
        edited_at: { type: ["string", "null"], format: date-time }

    IssueStatus:
      type: string
      enum: [backlog, todo, in_progress, review, done, cancelled]

    IssuePriority:
      type: string
      enum: [none, urgent, high, medium, low]

    Label:
      type: object
      required: [id, project_id, name, color]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }

    Issue:
      type: object
      required: [id, project_id, number, key, title, description, status, priority, labels, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        number: { type: integer }
        key: { type: string, description: "PROJECTKEY-number, e.g. AT-1" }
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/IssueStatus" }
        priority: { $ref: "#/components/schemas/IssuePriority" }
        assignee:
          anyOf:
            - $ref: "#/components/schemas/MessageAuthor"
            - type: "null"
        labels:
          type: array
          items: { $ref: "#/components/schemas/Label" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    IssueActivity:
      type: object
      required: [id, kind, actor, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, description: "created | status_changed | field_changed | commented | from_message" }
        actor:
          anyOf:
            - $ref: "#/components/schemas/MessageAuthor"
            - type: "null"
        payload:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }

    ProjectOverview:
      type: object
      required: [project, counts, recent_messages]
      properties:
        project: { $ref: "#/components/schemas/Project" }
        counts:
          type: object
          required: [members, messages, conversations]
          properties:
            members: { type: integer }
            messages: { type: integer }
            conversations: { type: integer }
        recent_messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
security:
  - sessionCookie: []
