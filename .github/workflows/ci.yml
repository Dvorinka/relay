name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - run: go build ./...
      - run: go test ./...
        env:
          RELAY_TEST_DATABASE_URL: postgres://relay:relay@127.0.0.1:5432/relay_e2e?sslmode=disable

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p apps/web
      - run: npm run lint --prefix apps/web --if-present
      - run: npm test --prefix apps/web --if-present
      - run: npm run build --prefix apps/web

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npx --yes @redocly/cli lint api/openapi.yaml
      # Regenerate and fail if the committed client drifted from the spec.
      - run: |
          npx --yes openapi-typescript api/openapi.yaml -o /tmp/schema.ts
          test ! -d packages/api-client/src/generated || \
            diff -u packages/api-client/src/generated/schema.ts /tmp/schema.ts

  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env && docker compose config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: relay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag relay:ci ghcr.io/dvorinka/relay:latest
          docker tag relay:ci ghcr.io/dvorinka/relay:sha-${GITHUB_SHA:0:7}
          docker push ghcr.io/dvorinka/relay:latest
          docker push ghcr.io/dvorinka/relay:sha-${GITHUB_SHA:0:7}

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      # webkit2_41 tag matches the installed libwebkit2gtk-4.1-dev; without it
      # wails' webview cgo looks for webkit2gtk-4.0.
      - run: cd apps/desktop && go mod download && go test -tags webkit2_41 ./...
      - name: Cross-build Windows binary
        run: |
          cd apps/desktop
          ~/go/bin/wails build -platform windows/amd64 -o relay-desktop.exe
          test -f build/bin/relay-desktop.exe
      - name: Build Linux binary
        run: |
          cd apps/desktop
          ~/go/bin/wails build -platform linux/amd64 -tags webkit2_41 -o relay-desktop
          test -f build/bin/relay-desktop
      - name: Verify Windows installer builds
        run: |
          sudo apt-get install -y nsis
          makensis -DVERSION=0.0.0-ci -DVI_VERSION=0.0.0.0 \
            -DEXE="$GITHUB_WORKSPACE/apps/desktop/build/bin/relay-desktop.exe" \
            -DOUTFILE="$GITHUB_WORKSPACE/apps/desktop/build/bin/Relay-Setup-ci.exe" \
            apps/desktop/installer/relay.nsi
          test -f apps/desktop/build/bin/Relay-Setup-ci.exe
      - uses: actions/upload-artifact@v6
        with:
          name: relay-desktop-windows
          path: apps/desktop/build/bin/relay-desktop.exe
      - uses: actions/upload-artifact@v6
        with:
          name: relay-installer-windows
          path: apps/desktop/build/bin/Relay-Setup-ci.exe
      - uses: actions/upload-artifact@v6
        with:
          name: relay-desktop-linux
          path: apps/desktop/build/bin/relay-desktop

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "1"
