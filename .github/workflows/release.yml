name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Build web bundle
        run: |
          npm ci
          npm run build --prefix apps/web

      - name: Build relay binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -o dist/relay-linux-amd64 ./cmd/relay
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o dist/relay-windows-amd64.exe ./cmd/relay
          CGO_ENABLED=0 go build -o dist/relay-cli-linux-amd64 ./cmd/relay-cli
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o dist/relay-cli-windows-amd64.exe ./cmd/relay-cli
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o dist/relay-cli-darwin-arm64 ./cmd/relay-cli

      - name: Install desktop toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y mingw-w64 libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build desktop binaries
        run: |
          cd apps/desktop
          ~/go/bin/wails build -platform windows/amd64 -o relay-desktop-windows-amd64.exe
          ~/go/bin/wails build -platform linux/amd64 -tags webkit2_41 -o relay-desktop-linux-amd64
          mv build/bin/relay-desktop-* ../../dist/
          rm -f ../../dist/*.o

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  # Android APK via Expo prebuild + Gradle. Produces a debug-signed,
  # installable APK — no EAS account or keystore secrets required. For a
  # store-signed release, run `eas build -p android` or add a signing
  # config in android/app/build.gradle after prebuild.
  apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci --prefix apps/mobile
      - name: Generate native android project
        working-directory: apps/mobile
        env:
          CI: "1"
        run: npx --yes expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Attach APK to release
        run: |
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk relay-android.apk
          gh release upload "$GITHUB_REF_NAME" relay-android.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the runtime image to GHCR: ghcr.io/dvorinka/relay:<tag> + :latest
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/dvorinka/relay
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
