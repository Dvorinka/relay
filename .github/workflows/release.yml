name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Build web bundle
        env:
          # baked into the SPA — the desktop shell embeds this same dist
          VITE_APP_VERSION: ${{ github.ref_name }}
        run: |
          npm ci
          npm run build --prefix apps/web

      - name: Build relay binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -o dist/relay-linux-amd64 ./cmd/relay
          CGO_ENABLED=0 go build -o dist/relay-cli-linux-amd64 ./cmd/relay-cli
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o dist/relay-cli-windows-amd64.exe ./cmd/relay-cli
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o dist/relay-cli-darwin-arm64 ./cmd/relay-cli

      - name: Install desktop toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y mingw-w64 nsis osslsigncode libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build desktop binaries
        run: |
          cd apps/desktop
          ~/go/bin/wails build -platform windows/amd64 -o relay-desktop-windows-amd64.exe
          ~/go/bin/wails build -platform linux/amd64 -tags webkit2_41 -o relay-desktop-linux-amd64
          mv build/bin/relay-desktop-* ../../dist/
          rm -f ../../dist/*.o

      # Authenticode signing is optional: without SIGNING_CERT_B64 the release
      # still ships unsigned binaries (Smart App Control may block them on
      # fresh Windows 11 installs — sign releases with a trusted cert).
      - name: Decode signing certificate
        env:
          SIGNING_CERT_B64: ${{ secrets.SIGNING_CERT_B64 }}
        run: |
          if [ -n "$SIGNING_CERT_B64" ]; then
            echo "$SIGNING_CERT_B64" | base64 -d > "$RUNNER_TEMP/relay-signing.pfx"
            echo "SIGNING_CERT_PFX=$RUNNER_TEMP/relay-signing.pfx" >> "$GITHUB_ENV"
          fi

      - name: Sign Windows binaries
        if: env.SIGNING_CERT_PFX != ''
        env:
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          ./scripts/sign-windows.sh dist/relay-desktop-windows-amd64.exe
          ./scripts/sign-windows.sh dist/relay-cli-windows-amd64.exe

      # makensis File paths resolve relative to the .nsi — pass absolute paths.
      # CLI_EXE adds the optional (default-on) relay-cli component to the
      # setup: one installer covers desktop + terminal client + PATH entry.
      # With a signing cert present, !finalize/!uninstfinalize also sign the
      # generated uninstaller and the installer itself.
      - name: Build Windows installer
        env:
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VI_VERSION="$(echo "$VERSION" | awk -F. '{printf "%d.%d.%d.%d", $1, $2, $3, $4 + 0}')"
          SIGNCMD_FLAG=""
          if [ -n "${SIGNING_CERT_PFX:-}" ]; then
            SIGNCMD_FLAG="-DSIGNCMD=bash $GITHUB_WORKSPACE/scripts/sign-windows.sh"
          fi
          makensis -DVERSION="$VERSION" -DVI_VERSION="$VI_VERSION" \
            $SIGNCMD_FLAG \
            -DEXE="$GITHUB_WORKSPACE/dist/relay-desktop-windows-amd64.exe" \
            -DCLI_EXE="$GITHUB_WORKSPACE/dist/relay-cli-windows-amd64.exe" \
            -DOUTFILE="$GITHUB_WORKSPACE/dist/Relay-Setup-$VERSION.exe" \
            apps/desktop/installer/relay.nsi

      # Windows ships exactly one artifact: the setup. The loose desktop and
      # CLI exes were build inputs — the installer packs both — and the
      # standalone Windows server binary isn't needed on the client OS.
      - name: Drop standalone Windows binaries
        run: |
          rm -f dist/relay-windows-amd64.exe \
                dist/relay-desktop-windows-amd64.exe \
                dist/relay-cli-windows-amd64.exe

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  # Android APK via Expo prebuild + Gradle release build. The JS bundle is
  # embedded, so the APK runs standalone (no Metro). With the
  # ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PASSWORD secrets set, it is
  # signed with the stable release key — updates install over the previous
  # version. Without secrets it falls back to the generated debug key
  # (installable, but the signature differs per build — for a real release
  # always set the secrets).
  apk:
    needs: build
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci --prefix apps/mobile
      - name: Generate native android project
        working-directory: apps/mobile
        env:
          CI: "1"
        run: npx --yes expo prebuild --platform android --no-install
      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d \
            > apps/mobile/android/app/release.keystore
      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          RELAY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELAY_KEY_ALIAS: relay
          RELAY_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Attach APK to release
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk relay-android.apk
          gh release upload "$GITHUB_REF_NAME" relay-android.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the runtime image to GHCR: ghcr.io/dvorinka/relay:<tag> + :latest
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/dvorinka/relay
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
